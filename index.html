<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d38">
<title>Gének kölcsönhatása – önellenőrző teszt</title>
<style>
:root{color-scheme:light;--ink:#18352f;--muted:#526b65;--paper:#f5f3e9;--card:#fffef9;--green:#176b57;--lime:#d7ec9c;--line:#d9e2d3;--wrong:#a53c35;--good:#176b57;--shadow:0 18px 48px #143c3220}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 3%,#dce9bd 0,transparent 38%),radial-gradient(ellipse at 90% 95%,#c9e1d4 0,transparent 37%),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.55}
main{width:min(900px,100% - 32px);margin:0 auto;padding:34px 0 60px}.hero{padding:12px 4px 24px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--green);font-size:.76rem}.hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.06;letter-spacing:-.04em;margin:10px 0 12px;max-width:760px}.hero p{color:var(--muted);max-width:670px;margin:0;font-size:1.05rem}.panel{background:var(--card);border:1px solid #dce5d9;border-radius:24px;padding:clamp(18px,4vw,34px);box-shadow:var(--shadow)}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}.progress-label{font-weight:750;font-size:.94rem}.score-pill{background:#e9f2d8;padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:800;white-space:nowrap}.track{height:8px;background:#e5eadf;border-radius:9px;overflow:hidden;margin:0 0 25px}.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#176b57,#9ab744);transition:width .3s ease}.question{font-size:clamp(1.2rem,2.7vw,1.65rem);font-weight:760;line-height:1.33;margin:0 0 20px}.answers{display:grid;gap:11px}.answer{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;transition:transform .13s,border-color .13s,background .13s}.answer:hover{border-color:#84a69a;transform:translateY(-1px)}.answer:focus-visible,.navbtn:focus-visible,.action:focus-visible{outline:3px solid #d2a631;outline-offset:3px}.answer[aria-pressed="true"]{border-color:var(--green);background:#eff6e7;box-shadow:inset 0 0 0 1px var(--green)}.letter{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#edf0e7;font-size:.83rem;font-weight:850;color:var(--green);margin-top:1px}.answer[aria-pressed="true"] .letter{background:var(--green);color:white}.answer-text{padding-top:2px}.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:13px;font-weight:650}.feedback.show{display:block}.feedback.correct{background:#e4f3e7;color:#145640}.feedback.incorrect{background:#fbe9e5;color:#812b28}.explanation{font-weight:450;margin-top:4px}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:24px}.navgroup{display:flex;gap:10px}.navbtn,.action{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.navbtn{background:#e9eee5;color:var(--ink)}.navbtn:disabled{opacity:.42;cursor:not-allowed}.action{background:var(--green);color:white}.action:hover{background:#105343}.action.secondary{background:#e9eee5;color:var(--ink)}.results{display:none;margin-top:22px}.results.show{display:block}.resultbox{border-radius:18px;padding:18px 20px;background:#edf4df;border:1px solid #d3e2bd}.resultbox h2{margin:0 0 4px;font-size:1.3rem}.resultbox p{margin:0;color:var(--muted)}.resultline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.review{margin-top:18px;display:grid;gap:10px}.review-item{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}.review-item.good{border-left:5px solid var(--good)}.review-item.bad{border-left:5px solid var(--wrong)}.review-item strong{display:block;margin-bottom:4px}.review-item p{margin:3px 0;color:var(--muted)}.footnote{text-align:center;color:var(--muted);font-size:.85rem;margin-top:18px}
@media(max-width:560px){main{width:min(100% - 20px,900px);padding-top:22px}.panel{border-radius:18px}.controls{align-items:stretch;flex-direction:column-reverse}.navgroup{display:grid;grid-template-columns:1fr 1fr}.navbtn,.action{min-height:46px}.resultline{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="hero">
  <div class="eyebrow">Biológia · öröklődés</div>
  <h1>Gének kölcsönhatása</h1>
  <p>Önellenőrző feleletválasztós teszt az alapfogalmakról és jellegzetes öröklődési jelenségekről. Válaszd ki a legjobb megoldást minden kérdésnél, majd ellenőrizd a tudásodat!</p>
</header>
<section class="panel" aria-label="Interaktív teszt">
  <div class="topline"><span class="progress-label" id="progressLabel">1. kérdés / 15</span><span class="score-pill" id="answeredLabel">Megválaszolva: 0 / 15</span></div>
  <div class="track" aria-hidden="true"><span id="progressBar"></span></div>
  <div id="quizArea" aria-live="polite"></div>
  <div class="controls" id="controls">
    <div class="navgroup"><button class="navbtn" id="prevBtn" type="button">← Előző</button><button class="navbtn" id="nextBtn" type="button">Következő →</button></div>
    <button class="action" id="checkBtn" type="button">Válaszok ellenőrzése</button>
  </div>
  <section class="results" id="results" aria-live="polite"></section>
</section>
<p class="footnote">15 kérdés · kérdésenként 1 pont</p>
</main>
<script>
const questions = [
 {q:"Mit jelent, ha egy tulajdonság kialakításában egynél több gén alléljai vesznek részt?",a:["A gének kölcsönhatása befolyásolja a fenotípust.","A tulajdonságot kizárólag a környezet alakítja.","A gének csak ivarsejtekben működnek.","Minden utód azonos fenotípusú lesz."],c:0,e:"A különböző gének alléljai kölcsönhatásba léphetnek, és ennek eredménye megjelenik a fenotípusban."},
 {q:"A házityúk tarajának alakját a bemutatott példában hány génpár határozza meg?",a:["Egy génpár.","Két génpár.","Három génpár.","A gének száma nem állapítható meg."],c:1,e:"A taraj alakját két gén két-két allélja, az R/r és a B/b allélpár befolyásolja."},
 {q:"Milyen taraj fenotípusúak az RrBb genotípusú utódok a bemutatott tyúktaraj-példában?",a:["Diótarajúak.","Borsótarajúak.","Rózsatarajúak.","Fűrészes tarajúak."],c:0,e:"Mindkét génből legalább egy domináns allélt hordoznak, ezért diótarajúak."},
 {q:"Mi az F₂ nemzedék jellegzetes fenotípusaránya a két gén által meghatározott tyúktaraj-példában?",a:["9 : 3 : 3 : 1.","3 : 1.","9 : 7.","12 : 3 : 1."],c:0,e:"A négy fenotípus aránya 9 diótarajú : 3 rózsatarajú : 3 borsótarajú : 1 fűrészes tarajú."},
 {q:"Mit nevezünk pleiotróp hatásnak?",a:["Egy gén hatással van több különböző tulajdonságra.","Több gén egyetlen tulajdonságot hoz létre.","Egy domináns allél elfedi egy másik gén hatását.","Két gén hatása összeadódik."],c:0,e:"Pleiotrópia esetén egyetlen gén több fenotípusos tulajdonság kialakításában vesz részt."},
 {q:"Melyik példa illusztrálja az egy génhez kapcsolódó többféle fenotípusos hatást?",a:["A borsó egy génje a virág- és a maghéj színét is befolyásolja.","A tyúktarajat két génpár alakítja.","A domináns A allél elfedi a B gén hatását.","Két domináns allél együtt lila kukoricaszemet eredményez."],c:0,e:"A leírt borsópéldában ugyanaz a gén az antociántermelésen keresztül a virág és a maghéj színére is hat."},
 {q:"Mit jelent az episztatikus génhatás?",a:["Az egyik gén elnyomja egy másik gén hatását.","Egy gén több tulajdonságot alakít ki.","Két gén hatása mindig azonos fenotípust eredményez.","Az allélok a környezet hatására megváltoznak."],c:0,e:"Az episztatikus gén elnyomja egy másik gén működésének fenotípusos hatását."},
 {q:"Domináns episztázis esetén mi nyomja el a másik gén hatását?",a:["Az episztatikus gén domináns allélja.","Az episztatikus gén recesszív allélpárja.","Mindig mindkét gén recesszív alléljai.","A másik gén két domináns allélja."],c:0,e:"Domináns episztázisban az egyik gén domináns allélja elegendő az elnyomó hatáshoz."},
 {q:"Melyik hasadási arány jellemző a domináns episztázis bemutatott példájára?",a:["12 : 3 : 1.","9 : 3 : 4.","9 : 6 : 1.","13 : 3."],c:0,e:"A domináns episztázis példájában a dihibridek hasadási aránya 12 : 3 : 1."},
 {q:"Recesszív episztázis esetén melyik genotípus-állapot fejti ki az elnyomó hatást a bemutatott példában?",a:["Az A gén aa homozigóta recesszív állapota.","Az A gén legalább egy domináns allélja.","A B gén BB homozigóta állapota.","Mindkét gén heterozigóta állapota."],c:0,e:"A recesszív episztázisban aa genotípus elnyomja a B gén hatását."},
 {q:"Melyik fenotípusarány jellemző a recesszív episztázisra a bemutatott példában?",a:["9 : 3 : 4.","12 : 3 : 1.","15 : 1.","9 : 7."],c:0,e:"Az aa genotípusú csoport összevonása adja a 9 : 3 : 4 arányt."},
 {q:"Mi jellemzi két gén additív hatását?",a:["A két gén hatása összeadódik a fenotípus kialakításában.","Az egyik gén teljesen elnyomja a másikat.","Egyetlen gén több tulajdonságot határoz meg.","Csak a recesszív allélok befolyásolják a fenotípust."],c:0,e:"Additív hatásnál mindkét gén domináns alléljai hozzájárulnak a fenotípushoz."},
 {q:"Melyik fenotípusarány jellemző a bemutatott additív génhatásra?",a:["9 : 6 : 1.","9 : 3 : 3 : 1.","9 : 7.","13 : 3."],c:0,e:"A bemutatott additív génhatás 9 : 6 : 1 arányú fenotípusos hasadást eredményez."},
 {q:"Kettős domináns hatás esetén melyik fenotípusarány szerepel a példában?",a:["15 : 1.","9 : 7.","12 : 3 : 1.","9 : 6 : 1."],c:0,e:"A pásztortáska példájában csak az aabb genotípus ad eltérő fenotípust, ezért az arány 15 : 1."},
 {q:"Mi a komplementer génhatás lényege a bemutatott kukoricapéldában?",a:["A két gén domináns alléljainak együttes jelenléte szükséges a lila színhez.","Bármelyik gén domináns allélja önmagában lila színt eredményez.","Az egyik gén recesszív allélpárja elnyomja a másikat.","Egyetlen gén többféle pigmentet termel."],c:0,e:"A lila színhez mindkét génből legalább egy domináns allél szükséges; ennek aránya 9 : 7."},
 {q:"Melyik hasadási arány tartozik a komplementer génhatáshoz?",a:["9 : 7.","15 : 1.","9 : 6 : 1.","13 : 3."],c:0,e:"A két gén domináns alléljainak kiegészítő hatása 9 : 7 arányt eredményez."},
 {q:"A házityúk tollszínének bemutatott domináns-recesszív génkölcsönhatásában milyen hatása van az A allélnak?",a:["Elnyomja a B allél tollszínt kialakító hatását.","A B alléllal együtt mindig színes tollat eredményez.","Csak aa genotípusban alakít ki színes tollat.","A tollszíntől függetlenül a taraj alakját módosítja."],c:0,e:"A leírt példában az A allél elnyomja a B allél színes tollat kialakító hatását."},
 {q:"Melyik fenotípusarány jellemző a bemutatott domináns-recesszív génkölcsönhatásra?",a:["13 : 3.","9 : 3 : 4.","12 : 3 : 1.","9 : 7."],c:0,e:"A házityúk tollszínének bemutatott példájában a hasadási arány 13 : 3."}
];
let current=0, answers=Array(questions.length).fill(null), checked=false;
const area=document.getElementById('quizArea'), progressLabel=document.getElementById('progressLabel'), answeredLabel=document.getElementById('answeredLabel'), progressBar=document.getElementById('progressBar'), prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn'), results=document.getElementById('results');
function render(){const item=questions[current];progressLabel.textContent=`${current+1}. kérdés / ${questions.length}`;answeredLabel.textContent=`Megválaszolva: ${answers.filter(x=>x!==null).length} / ${questions.length}`;progressBar.style.width=`${(answers.filter(x=>x!==null).length/questions.length)*100}%`;prevBtn.disabled=current===0;nextBtn.disabled=current===questions.length-1;
 let html=`<h2 class="question" id="questionText">${current+1}. ${item.q}</h2><div class="answers" role="group" aria-labelledby="questionText">`;
 item.a.forEach((text,i)=>{html+=`<button class="answer" type="button" aria-pressed="${answers[current]===i}" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="answer-text">${text}</span></button>`});
 html+='</div>';
 if(checked){const ok=answers[current]===item.c;html+=`<div class="feedback show ${ok?'correct':'incorrect'}" role="status">${answers[current]===null?'Erre a kérdésre nem jelöltél választ.':ok?'Helyes válasz.':'Nem ez a helyes válasz.'}<div class="explanation"><strong>Megoldás:</strong> ${String.fromCharCode(65+item.c)}. ${item.a[item.c]} ${item.e}</div></div>`}
 area.innerHTML=html;area.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{if(checked)return;answers[current]=Number(btn.dataset.choice);render()}));
}
prevBtn.addEventListener('click',()=>{if(current>0){current--;render()}});nextBtn.addEventListener('click',()=>{if(current<questions.length-1){current++;render()}});
document.getElementById('checkBtn').addEventListener('click',()=>{checked=true;const score=answers.reduce((n,a,i)=>n+(a===questions[i].c?1:0),0);results.classList.add('show');results.innerHTML=`<div class="resultbox"><h2>Eredmény: ${score} / ${questions.length} pont</h2><p>${score===questions.length?'Kiváló, minden válaszod helyes!':score>=11?'Szép munka! Nézd át az esetleges hibákat.':score>=8?'Jó alap, érdemes még egyszer átnézni a fogalmakat.':'Nézd át a fogalmakat, majd próbáld újra!'}</p><div class="resultline"><span>${answers.filter(x=>x!==null).length} kérdésre válaszoltál a ${questions.length}-ből.</span><button class="action secondary" id="retryBtn" type="button">Újrakezdés</button></div></div><div class="review"><h2>Válaszok és megoldások</h2>${questions.map((item,i)=>{const ok=answers[i]===item.c;return `<article class="review-item ${ok?'good':'bad'}"><strong>${i+1}. ${ok?'✓ Helyes':'✗ Javítandó'} — ${item.q}</strong><p><b>A helyes válasz:</b> ${String.fromCharCode(65+item.c)}. ${item.a[item.c]}</p><p>${item.e}</p>${answers[i]!==null&&!ok?`<p><b>A te válaszod:</b> ${String.fromCharCode(65+answers[i])}. ${item.a[answers[i]]}</p>`:''}</article>`}).join('')}</div>`;document.getElementById('checkBtn').textContent='Eredmények megjelenítve';document.getElementById('checkBtn').disabled=true;document.getElementById('retryBtn').addEventListener('click',()=>{current=0;answers=Array(questions.length).fill(null);checked=false;results.classList.remove('show');results.innerHTML='';document.getElementById('checkBtn').textContent='Válaszok ellenőrzése';document.getElementById('checkBtn').disabled=false;render();window.scrollTo({top:0,behavior:'smooth'})});render();results.scrollIntoView({behavior:'smooth',block:'start'});});
render();
</script>
</body>
</html>
